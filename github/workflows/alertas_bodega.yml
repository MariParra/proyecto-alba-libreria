name: Despacho Diario de Reporte de Bodega

on:
  schedule:
    # Programación en formato POSIX Cron (Hora en UTC/GMT)
    # Chile continental (normalmente UTC-4 / horario de verano UTC-3)
    # Ajustado para enviarse a las 09:00 AM, 14:00 PM y 19:00 PM (Hora de Chile, asumiendo UTC-4)
    - cron: '0 13 * * *'  # 13:00 UTC = 09:00 AM Chile
    - cron: '0 18 * * *'  # 18:00 UTC = 14:00 PM Chile
    - cron: '0 23 * * *'  # 23:00 UTC = 19:00 PM Chile
  
  # Permite disparar el reporte de forma manual desde el panel de GitHub
  workflow_dispatch:

jobs:
  enviar_reporte:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar Código del Repositorio
      uses: actions/checkout@v3

    - name: Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-python: '3.11'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pandas supabase

    - name: Ejecutar Script de Alertas
      env:
        # Mapeo de variables de entorno seguras desde los secretos de GitHub
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        EMAIL_EMISOR: ${{ secrets.EMAIL_EMISOR }}
        EMAIL_RECEPTOR: ${{ secrets.EMAIL_RECEPTOR }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: python 2_scripts/cron_correo_diario.py
